name: CI

on:
  pull_request:
    branches:
      - develop

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: backend の依存関係を install
        working-directory: backend
        run: pip install -r requirements.txt

      - name: backend の Python 構文を確認
        working-directory: backend
        run: python -m compileall app alembic

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Flutter をセットアップ
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: frontend の依存関係を取得
        working-directory: frontend
        run: flutter pub get

      - name: frontend を analyze
        working-directory: frontend
        run: flutter analyze

      - name: frontend test を実行
        working-directory: frontend
        run: flutter test

  worker:
    name: worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/cloudflare/app-worker/package-lock.json

      - name: Worker の依存関係を install
        working-directory: infra/cloudflare/app-worker
        run: npm ci

      - name: Worker を型チェック
        working-directory: infra/cloudflare/app-worker
        run: npm run check
