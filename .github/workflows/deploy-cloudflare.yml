name: Cloudflare デプロイ

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "デプロイ先の Cloudflare environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-cloudflare-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/cloudflare/app-worker/package-lock.json

      - name: Flutter をセットアップ
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: frontend の依存関係を取得
        working-directory: frontend
        run: flutter pub get

      - name: 法務文書をアプリ表示用コードへ反映
        working-directory: frontend
        run: dart run tool/generate_legal_content.dart

      - name: frontend を静的解析
        working-directory: frontend
        run: flutter analyze

      - name: frontend の回帰テスト
        working-directory: frontend
        run: |
          flutter test \
            --dart-define=DEMO_MODE=true \
            --dart-define=DEMO_ROOM_CODE=G7M24 \
            --dart-define=GURUMEET_ENABLE_MOCKS=true \
            --dart-define=GURUMEET_API_BASE_URL=http://localhost:8000 \
            --dart-define=GURUMEET_INVITE_BASE_URL=http://localhost:3000

      - name: frontend web を build
        working-directory: frontend
        run: |
          if [[ "$DEPLOY_ENV" == "production" ]]; then
            FRONTEND_URL="https://gurumeet.net"
          else
            FRONTEND_URL="https://stg.gurumeet.net"
          fi

          flutter build web --release \
            --dart-define=DEMO_MODE=false \
            --dart-define=GURUMEET_ENABLE_MOCKS=false \
            --dart-define=GURUMEET_API_BASE_URL="${FRONTEND_URL}/api" \
            --dart-define=GURUMEET_INVITE_BASE_URL="${FRONTEND_URL}"

      - name: Worker の依存関係を install
        working-directory: infra/cloudflare/app-worker
        run: npm ci

      - name: Worker を型チェック
        working-directory: infra/cloudflare/app-worker
        run: npm run check

      - name: Docker を確認
        run: docker info

      - name: GitHub Environment secrets / vars を検証
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HOTPEPPER_API_KEY: ${{ secrets.HOTPEPPER_API_KEY }}
          PARTICIPANT_TOKEN_HASH_SECRET: ${{ secrets.PARTICIPANT_TOKEN_HASH_SECRET }}
          INTERNAL_TASK_SECRET: ${{ secrets.INTERNAL_TASK_SECRET }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CLEANUP_FORWARD_SECRET: ${{ secrets.DISCORD_CLEANUP_FORWARD_SECRET }}
          DISCORD_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_APPLICATION_PUBLIC_KEY: ${{ secrets.DISCORD_APPLICATION_PUBLIC_KEY }}
          DISCORD_DELETE_COMMAND_ALLOWED_USER_IDS: ${{ secrets.DISCORD_DELETE_COMMAND_ALLOWED_USER_IDS }}
          CORS_ALLOW_ORIGINS: ${{ vars.CORS_ALLOW_ORIGINS }}
          GURUMEET_ENABLE_MOCK_RESTAURANTS: ${{ vars.GURUMEET_ENABLE_MOCK_RESTAURANTS }}
          DISCORD_STAGING_CLEANUP_URL: ${{ vars.DISCORD_STAGING_CLEANUP_URL }}
          DISCORD_PRODUCTION_CLEANUP_URL: ${{ vars.DISCORD_PRODUCTION_CLEANUP_URL }}
        run: |
          required_secrets=(
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            DATABASE_URL
            HOTPEPPER_API_KEY
            PARTICIPANT_TOKEN_HASH_SECRET
            INTERNAL_TASK_SECRET
            DISCORD_BOT_TOKEN
            DISCORD_CLEANUP_FORWARD_SECRET
            DISCORD_ALERT_WEBHOOK_URL
            DISCORD_APPLICATION_ID
            DISCORD_APPLICATION_PUBLIC_KEY
            DISCORD_DELETE_COMMAND_ALLOWED_USER_IDS
          )

          required_vars=(
            CORS_ALLOW_ORIGINS
            GURUMEET_ENABLE_MOCK_RESTAURANTS
            DISCORD_STAGING_CLEANUP_URL
            DISCORD_PRODUCTION_CLEANUP_URL
          )

          missing=()
          for name in "${required_secrets[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf "::error::GitHub Environment '%s' is missing required secrets: %s\n" \
              "$DEPLOY_ENV" \
              "${missing[*]}"
            exit 1
          fi

          missing_vars=()
          for name in "${required_vars[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing_vars+=("$name")
            fi
          done

          if (( ${#missing_vars[@]} > 0 )); then
            printf "::error::GitHub Environment '%s' is missing required vars: %s\n" \
              "$DEPLOY_ENV" \
              "${missing_vars[*]}"
            exit 1
          fi

          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID must be exactly 32 lowercase hex characters. Check for leading/trailing spaces in the GitHub secret."
            exit 1
          fi

          if [[ ! "$DATABASE_URL" =~ ^postgresql(\+psycopg)?:// ]]; then
            echo "::error::DATABASE_URL must start with postgresql:// or postgresql+psycopg://."
            exit 1
          fi

          case "$PARTICIPANT_TOKEN_HASH_SECRET" in
            gurumeet-dev-participant-token-secret|change_me*)
              echo "::error::PARTICIPANT_TOKEN_HASH_SECRET must not use the local development placeholder."
              exit 1
              ;;
          esac

          case "$INTERNAL_TASK_SECRET" in
            change_me*)
              echo "::error::INTERNAL_TASK_SECRET must not use the local development placeholder."
              exit 1
              ;;
          esac

          case "$DISCORD_CLEANUP_FORWARD_SECRET" in
            change_me*)
              echo "::error::DISCORD_CLEANUP_FORWARD_SECRET must not use the local development placeholder."
              exit 1
              ;;
          esac

          if [[ ! "$DISCORD_APPLICATION_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::DISCORD_APPLICATION_ID must be a numeric Discord application ID."
            exit 1
          fi

          if [[ ! "$DISCORD_APPLICATION_PUBLIC_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::DISCORD_APPLICATION_PUBLIC_KEY must be a 64 character hex public key."
            exit 1
          fi

          if [[ ! "$DISCORD_STAGING_CLEANUP_URL" =~ ^https:// ]]; then
            echo "::error::DISCORD_STAGING_CLEANUP_URL must start with https://."
            exit 1
          fi

          if [[ ! "$DISCORD_PRODUCTION_CLEANUP_URL" =~ ^https:// ]]; then
            echo "::error::DISCORD_PRODUCTION_CLEANUP_URL must start with https://."
            exit 1
          fi

      - name: Worker を deploy
        working-directory: infra/cloudflare/app-worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HOTPEPPER_API_KEY: ${{ secrets.HOTPEPPER_API_KEY }}
          PARTICIPANT_TOKEN_HASH_SECRET: ${{ secrets.PARTICIPANT_TOKEN_HASH_SECRET }}
          INTERNAL_TASK_SECRET: ${{ secrets.INTERNAL_TASK_SECRET }}
          DISCORD_CLEANUP_FORWARD_SECRET: ${{ secrets.DISCORD_CLEANUP_FORWARD_SECRET }}
          DISCORD_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
          DISCORD_APPLICATION_PUBLIC_KEY: ${{ secrets.DISCORD_APPLICATION_PUBLIC_KEY }}
          DISCORD_DELETE_COMMAND_ALLOWED_USER_IDS: ${{ secrets.DISCORD_DELETE_COMMAND_ALLOWED_USER_IDS }}
          CORS_ALLOW_ORIGINS: ${{ vars.CORS_ALLOW_ORIGINS }}
          GURUMEET_ENABLE_MOCK_RESTAURANTS: ${{ vars.GURUMEET_ENABLE_MOCK_RESTAURANTS }}
          DISCORD_STAGING_CLEANUP_URL: ${{ vars.DISCORD_STAGING_CLEANUP_URL }}
          DISCORD_PRODUCTION_CLEANUP_URL: ${{ vars.DISCORD_PRODUCTION_CLEANUP_URL }}
          CLOUDFLARE_SECRETS_FILE: ${{ runner.temp }}/cloudflare-worker-secrets.json
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";

          const secretNames = [
            "DATABASE_URL",
            "HOTPEPPER_API_KEY",
            "PARTICIPANT_TOKEN_HASH_SECRET",
            "INTERNAL_TASK_SECRET",
            "DISCORD_CLEANUP_FORWARD_SECRET",
            "DISCORD_ALERT_WEBHOOK_URL",
            "DISCORD_APPLICATION_PUBLIC_KEY",
            "DISCORD_DELETE_COMMAND_ALLOWED_USER_IDS",
          ];

          const secrets = Object.fromEntries(
            secretNames.map((name) => [name, process.env[name] ?? ""]),
          );

          writeFileSync(
            process.env.CLOUDFLARE_SECRETS_FILE,
            `${JSON.stringify(secrets)}\n`,
            { mode: 0o600 },
          );
          NODE

          npx wrangler deploy \
            --env "$DEPLOY_ENV" \
            --secrets-file "$CLOUDFLARE_SECRETS_FILE" \
            --var "CORS_ALLOW_ORIGINS:$CORS_ALLOW_ORIGINS" \
            --var "GURUMEET_ENABLE_MOCK_RESTAURANTS:$GURUMEET_ENABLE_MOCK_RESTAURANTS" \
            --var "DISCORD_STAGING_CLEANUP_URL:$DISCORD_STAGING_CLEANUP_URL" \
            --var "DISCORD_PRODUCTION_CLEANUP_URL:$DISCORD_PRODUCTION_CLEANUP_URL"

      - name: Discord slash command を登録
        working-directory: infra/cloudflare/app-worker
        env:
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: npm run register-discord-commands
