name: Cloudflare デプロイ

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "デプロイ先の Cloudflare environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-cloudflare-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      HOTPEPPER_API_KEY: ${{ secrets.HOTPEPPER_API_KEY }}
      PARTICIPANT_TOKEN_HASH_SECRET: ${{ secrets.PARTICIPANT_TOKEN_HASH_SECRET }}
      INTERNAL_TASK_SECRET: ${{ secrets.INTERNAL_TASK_SECRET }}
      DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/cloudflare/app-worker/package-lock.json

      - name: Flutter をセットアップ
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: frontend の依存関係を取得
        working-directory: frontend
        run: flutter pub get

      - name: frontend web を build
        working-directory: frontend
        run: |
          if [[ "$DEPLOY_ENV" == "production" ]]; then
            FRONTEND_URL="https://gurumeet.net"
          else
            FRONTEND_URL="https://stg.gurumeet.net"
          fi

          flutter build web --release \
            --dart-define=GURUMEET_ENABLE_MOCKS=false \
            --dart-define=GURUMEET_API_BASE_URL="${FRONTEND_URL}/api" \
            --dart-define=GURUMEET_INVITE_BASE_URL="${FRONTEND_URL}"

      - name: Worker の依存関係を install
        working-directory: infra/cloudflare/app-worker
        run: npm ci

      - name: Worker を型チェック
        working-directory: infra/cloudflare/app-worker
        run: npm run check

      - name: Docker を確認
        run: docker info

      - name: Cloudflare secrets を検証
        run: |
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID must be exactly 32 lowercase hex characters. Check for leading/trailing spaces in the GitHub secret."
            exit 1
          fi

          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty."
            exit 1
          fi

          for secret_name in DATABASE_URL HOTPEPPER_API_KEY PARTICIPANT_TOKEN_HASH_SECRET INTERNAL_TASK_SECRET; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::${secret_name} is empty. Configure it as a GitHub environment secret for ${DEPLOY_ENV}."
              exit 1
            fi
          done

      - name: Runtime secrets を Cloudflare に登録
        working-directory: infra/cloudflare/app-worker
        run: |
          printf "%s" "$DATABASE_URL" | npx wrangler secret put DATABASE_URL --env "$DEPLOY_ENV"
          printf "%s" "$HOTPEPPER_API_KEY" | npx wrangler secret put HOTPEPPER_API_KEY --env "$DEPLOY_ENV"
          printf "%s" "$PARTICIPANT_TOKEN_HASH_SECRET" | npx wrangler secret put PARTICIPANT_TOKEN_HASH_SECRET --env "$DEPLOY_ENV"
          printf "%s" "$INTERNAL_TASK_SECRET" | npx wrangler secret put INTERNAL_TASK_SECRET --env "$DEPLOY_ENV"

      - name: Worker を deploy
        working-directory: infra/cloudflare/app-worker
        run: npx wrangler deploy --env "$DEPLOY_ENV"
