name: Cloudflare デプロイ

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "デプロイ先の Cloudflare environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-cloudflare-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/cloudflare/app-worker/package-lock.json

      - name: Flutter をセットアップ
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: frontend の依存関係を取得
        working-directory: frontend
        run: flutter pub get

      - name: frontend web を build
        working-directory: frontend
        run: flutter build web --release

      - name: Worker の依存関係を install
        working-directory: infra/cloudflare/app-worker
        run: npm ci

      - name: Worker を型チェック
        working-directory: infra/cloudflare/app-worker
        run: npm run check

      - name: Docker を確認
        run: docker info

      - name: Worker を deploy
        working-directory: infra/cloudflare/app-worker
        run: npx wrangler deploy --env "$DEPLOY_ENV"
