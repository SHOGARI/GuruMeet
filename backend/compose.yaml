services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: gurumeet-backend-api
    ports:
      - "${API_PORT}:8000"
    volumes:
      - .:/app
    environment:
      HOTPEPPER_API_KEY: ${HOTPEPPER_API_KEY}
      POSTGRES_DB: ${POSTGRES_DB:-gurumeet}
      POSTGRES_USER: ${POSTGRES_USER:-gurumeet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      TEMPORARY_GROUP_TTL_MINUTES: ${TEMPORARY_GROUP_TTL_MINUTES:-1440}
      TEMPORARY_GROUP_CODE_MAX_ATTEMPTS: ${TEMPORARY_GROUP_CODE_MAX_ATTEMPTS:-20}
      JOIN_RATE_LIMIT_REQUESTS: ${JOIN_RATE_LIMIT_REQUESTS:-10}
      JOIN_RATE_LIMIT_WINDOW_SECONDS: ${JOIN_RATE_LIMIT_WINDOW_SECONDS:-60}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gurumeet}
      POSTGRES_USER: ${POSTGRES_USER:-gurumeet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gurumeet} -d ${POSTGRES_DB:-gurumeet}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
