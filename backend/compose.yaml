services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: gurumeet-backend-api
    ports:
      - "${API_PORT}:8000"
    volumes:
      - .:/app
    environment:
      TZ: Asia/Tokyo
      HOTPEPPER_API_KEY: ${HOTPEPPER_API_KEY}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      TEMPORARY_GROUP_CODE_MAX_ATTEMPTS: ${TEMPORARY_GROUP_CODE_MAX_ATTEMPTS}
      JOIN_RATE_LIMIT_REQUESTS: ${JOIN_RATE_LIMIT_REQUESTS}
      JOIN_RATE_LIMIT_WINDOW_SECONDS: ${JOIN_RATE_LIMIT_WINDOW_SECONDS}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS}
      GURUMEET_ENABLE_MOCK_RESTAURANTS: ${GURUMEET_ENABLE_MOCK_RESTAURANTS}
      GURUMEET_HOTPEPPER_STATION_SEARCH_RADIUS_METERS: ${GURUMEET_HOTPEPPER_STATION_SEARCH_RADIUS_METERS}
      GURUMEET_HOTPEPPER_MUNICIPALITY_SEARCH_RADIUS_METERS: ${GURUMEET_HOTPEPPER_MUNICIPALITY_SEARCH_RADIUS_METERS}
      PARTICIPANT_TOKEN_HASH_SECRET: ${PARTICIPANT_TOKEN_HASH_SECRET}
      INTERNAL_TASK_SECRET: ${INTERNAL_TASK_SECRET}
      DISCORD_ALERT_WEBHOOK_URL: ${DISCORD_ALERT_WEBHOOK_URL}
      REQUEST_BODY_MAX_BYTES: ${REQUEST_BODY_MAX_BYTES}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  db:
    image: postgres:16-alpine
    environment:
      TZ: Asia/Tokyo
      PGTZ: Asia/Tokyo
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["postgres", "-c", "timezone=Asia/Tokyo"]
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
